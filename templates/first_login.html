{% extends "base.html" %}

{% block title %}Complete First Login - PipeFlow PG Manager{% endblock %}

{% block content %}
<section class="auth-panel first-login-panel">
    <h2>Complete First Login</h2>
    <p class="muted-text">Replace the temporary password for {{ email }} and create your private recovery phrase.</p>

    {% if error %}<div class="alert-error">{{ error }}</div>{% endif %}

    <form method="POST" class="form-grid auth-form" autocomplete="off">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <label for="password">New Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required autofocus>

        <label for="confirm_password">Confirm New Password</label>
        <input type="password" id="confirm_password" name="confirm_password" autocomplete="new-password" minlength="8" required>

        <label for="reset_phrase">Secret Reset Phrase</label>
        <input type="password" id="reset_phrase" name="reset_phrase" minlength="12" required>

        <label for="confirm_reset_phrase">Confirm Secret Phrase</label>
        <input type="password" id="confirm_reset_phrase" name="confirm_reset_phrase" minlength="12" required>

        <button type="submit" class="btn btn-primary">Complete First Login</button>
    </form>

    <form method="POST" action="{{ url_for('logout') }}" class="first-login-signout">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <button type="submit" class="btn btn-secondary">Sign Out</button>
    </form>
</section>
{% endblock %}
