{% extends "base.html" %}

{% block title %}Edit Outreach | PipeFlow{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Edit Outreach</h1>
        <p>Update prospecting activity, outcomes and next actions.</p>
    </div>

    <a href="{{ url_for('outreach') }}" class="btn btn-secondary">
        Back to Outreach
    </a>
</div>

<div class="form-card">
    <form method="POST" class="pipeflow-form">

        <div class="form-grid">

            <div class="form-group">
                <label for="fy">FY</label>
                <input type="text" id="fy" name="fy" maxlength="2" pattern="[0-9]{2}" value="{{ outreach_item.fy or '' }}">
            </div>

            <div class="form-group">
                <label for="quarter">Quarter</label>
                <select id="quarter" name="quarter">
                    <option value="">Select quarter</option>
                    {% for q in dropdown_values.quarters %}
                        <option value="{{ q }}" {% if outreach_item.quarter == q %}selected{% endif %}>{{ q }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="campaign">Campaign Name</label>
                <input type="text"
                       id="campaign"
                       name="campaign"
                       list="campaign_options"
                       value="{{ outreach_item.campaign or '' }}"
                       placeholder="Campaign name">
                <datalist id="campaign_options">
                    {% for campaign in campaign_options %}
                        <option value="{{ campaign }}">{{ campaign }}</option>
                    {% endfor %}
                </datalist>
            </div>

            <div class="form-group">
                <label for="sales_play">Sales Play</label>
                <input type="text"
                       id="sales_play"
                       name="sales_play"
                       value="{{ outreach_item.sales_play or '' }}">
            </div>

            <div class="form-group">
                <label for="account_id">Account</label>
                <select id="account_id" name="account_id" required>
                    <option value="">Select account</option>
                    {% for account in accounts %}
                        <option value="{{ account.id }}" {% if outreach_item.account_id == account.id %}selected{% endif %}>
                            {{ account.account_name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="contact_id">Contact</label>
                <select id="contact_id" name="contact_id">
                    <option value="">Select contact</option>
                    {% for contact in contacts %}
                        <option value="{{ contact.id }}" {% if outreach_item.contact_id == contact.id %}selected{% endif %}>
                            {{ contact.name }}{% if contact.account_name %} - {{ contact.account_name }}{% endif %}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="activity_type">Activity Type</label>
                <select id="activity_type" name="activity_type" required>
                    <option value="">Select activity type</option>
                    {% for activity in dropdown_values.outreach_activity_types %}
                        <option value="{{ activity }}" {% if outreach_item.activity_type == activity %}selected{% endif %}>{{ activity }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="activity_date">Activity Start Date</label>
                <input type="date" id="activity_date" name="activity_date" value="{{ outreach_item.activity_date or '' }}" required>
            </div>

            <div class="form-group">
                <label for="activity_time">Activity Start Time</label>
                <input type="time" id="activity_time" name="activity_time" value="{{ outreach_item.activity_time or '' }}">
            </div>

            <div class="form-group full-width">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject" value="{{ outreach_item.subject or '' }}">
            </div>

            <div class="form-group full-width">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" rows="5">{{ outreach_item.notes or '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="outcome">Outcome</label>
                <select id="outcome" name="outcome">
                    <option value="">Select outcome</option>
                    {% for outcome in dropdown_values.outreach_outcomes %}
                        <option value="{{ outcome }}" {% if outreach_item.outcome == outcome %}selected{% endif %}>{{ outcome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="next_action_date">Activity Due Date</label>
                <input type="date" id="next_action_date" name="next_action_date" value="{{ outreach_item.next_action_date or '' }}">
            </div>

            <div class="form-group">
                <label for="next_action_time">Activity Due Time</label>
                <input type="time" id="next_action_time" name="next_action_time" value="{{ outreach_item.next_action_time or '' }}">
            </div>

            <div class="form-group full-width">
                <label for="next_action">Next Action</label>
                <textarea id="next_action" name="next_action" rows="4">{{ outreach_item.next_action or '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="task_status">Task Status</label>
                <select id="task_status" name="task_status">
                    {% for status in dropdown_values.task_statuses %}
                        <option value="{{ status }}" {% if outreach_item.task_status == status %}selected{% endif %}>
                            {{ status }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="assigned_to">Assigned To</label>
                <select id="assigned_to" name="assigned_to">
                    <option value="" {% if not outreach_item.assigned_to %}selected{% endif %}>Unassigned</option>

                    {% if profile and profile["full_name"] %}
                        <option value="{{ profile['full_name'] }}" {% if outreach_item.assigned_to == profile["full_name"] %}selected{% endif %}>
                            {{ profile["full_name"] }}
                        </option>
                    {% else %}
                        <option value="Melissa" {% if outreach_item.assigned_to == "Melissa" %}selected{% endif %}>
                            Melissa
                        </option>
                    {% endif %}
                </select>
            </div>

        </div>

        <div class="form-actions">
            <button type="submit" name="submit_action" value="save" class="btn btn-primary">
                Save Changes
            </button>

            <button type="submit" name="submit_action" value="complete_and_follow" class="btn btn-primary">
                Complete and Create Follow-on
            </button>

            <button type="submit" name="submit_action" value="complete_only" class="btn btn-secondary">
                Complete Only
            </button>

            <a href="{{ url_for('outreach') }}" class="btn btn-secondary">
                Cancel Without Changes
            </a>
        </div>

    </form>
</div>

{% endblock %}
