{% extends "base.html" %}

{% block title %}Add Contact | PipeFlow{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Add Contact</h1>
        <p>Create a new stakeholder contact for your pipeline activity.</p>
    </div>

    <a href="{{ url_for('contacts') }}" class="btn btn-secondary">
        Back to Contacts
    </a>
</div>

<div class="form-card">

    <form method="POST" enctype="multipart/form-data" class="pipeflow-form">

        <div class="form-grid">

            <div class="form-group">
                <label for="account_id">Company / Account</label>
                <select id="account_id" name="account_id" required>
                    <option value="">Select company / account</option>
                    {% for account in accounts %}
                        <option value="{{ account.id }}">{{ account.account_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="category">Category</label>
                <select id="category" name="category" required>
                    <option value="">Select category</option>
                    {% for category in dropdown_values.contact_categories %}
                        <option value="{{ category }}">{{ category }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="photo">Photo</label>
                <input type="file" id="photo" name="photo" accept=".png,.jpg,.jpeg">
            </div>

            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="job_title">Job Title</label>
                <input type="text" id="job_title" name="job_title">
            </div>

            <div class="form-group">
                <label for="org_dept">Org / Dept</label>
                <input type="text" id="org_dept" name="org_dept">
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email">
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="text" id="phone" name="phone">
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location">
            </div>

            <div class="form-group">
                <label for="linkedin">LinkedIn</label>
                <input type="text" id="linkedin" name="linkedin">
            </div>

            <div class="form-group">
                <label for="bmc_relationship">BMC Relationship</label>
                <select id="bmc_relationship" name="bmc_relationship">
                    <option value="">Select relationship</option>
                    {% for relationship in dropdown_values.bmc_relationships %}
                        <option value="{{ relationship }}">{{ relationship }}</option>
                    {% endfor %}
                </select>
            </div>

        </div>

        <div class="form-grid notes-grid">

            <div class="form-group">
                <label for="responsibilities">Responsibilities</label>
                <textarea id="responsibilities" name="responsibilities" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="characteristics">Characteristics</label>
                <textarea id="characteristics" name="characteristics" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="background">Background</label>
                <textarea id="background" name="background" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="personal_interests">Personal Interests</label>
                <textarea id="personal_interests" name="personal_interests" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="personal_win">Personal Win</label>
                <textarea id="personal_win" name="personal_win" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="education">Education</label>
                <textarea id="education" name="education" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="social_media">Social Media</label>
                <textarea id="social_media" name="social_media" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="additional_notes">Additional Notes</label>
                <textarea id="additional_notes" name="additional_notes" rows="4"></textarea>
            </div>

        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                Save Contact
            </button>

            <a href="{{ url_for('contacts') }}" class="btn btn-secondary">
                Cancel
            </a>
        </div>

    </form>

</div>

{% endblock %}
