{% extends "base.html" %}

{% block title %}Reset Password - PipeFlow PG Manager{% endblock %}

{% block content %}
<section class="auth-panel">
    <h2>Reset Password</h2>
    <p class="muted-text">Enter your email and secret reset phrase to set a new password.</p>

    {% if error %}
        <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" class="form-grid auth-form" autocomplete="on">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" autocomplete="username" required autofocus>

        <label for="reset_phrase">Secret Reset Phrase</label>
        <input type="password" id="reset_phrase" name="reset_phrase" autocomplete="off" minlength="12" required>

        <label for="password">New Password</label>
        <input type="password" id="password" name="password" autocomplete="new-password" minlength="8" required>

        <button type="submit" class="btn btn-primary">Reset Password</button>
    </form>

    <p class="muted-text">
        <a href="{{ url_for('login') }}">Back to sign in</a>
    </p>
</section>
{% endblock %}
