{% extends "base.html" %}

{% block title %}Edit Contact | PipeFlow{% endblock %}

{% block content %}

<h2>Edit Contact</h2>

<form method="POST" class="pipeflow-form">

    <label for="account_id">Company / Account</label>
    <select id="account_id" name="account_id" required>
        <option value="">Select company / account</option>
        {% for account in accounts %}
            <option value="{{ account.id }}" data-business-unit="{{ account.business_unit or '' }}" {% if contact.account_id == account.id %}selected{% endif %}>
                {{ account.account_name }}{% if account.business_unit %} - {{ account.business_unit }}{% endif %}
            </option>
        {% endfor %}
    </select>

    <label for="selected_account_business_unit">Account Business Unit / Org</label>
    <input type="text"
           id="selected_account_business_unit"
           value=""
           placeholder="Select an account to show its business org"
           readonly>

    <label for="category">Category</label>
    <select id="category" name="category" required>
        <option value="">Select category</option>
        {% for category in dropdown_values.contact_categories %}
            <option value="{{ category }}" {% if contact.category == category %}selected{% endif %}>{{ category }}</option>
        {% endfor %}
    </select>

    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ contact.name }}" required>

    <label for="job_title">Job Title</label>
    <input type="text" id="job_title" name="job_title" value="{{ contact.job_title }}">

    <label for="org_dept">Org / Dept</label>
    <input type="text" id="org_dept" name="org_dept" value="{{ contact.org_dept }}">

    <label for="responsibilities">Responsibilities</label>
    <textarea id="responsibilities" name="responsibilities" rows="4">{{ contact.responsibilities }}</textarea>

    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ contact.email }}">

    <label for="phone">Phone</label>
    <input type="text" id="phone" name="phone" value="{{ contact.phone }}">

    <label for="location">Location</label>
    <input type="text" id="location" name="location" value="{{ contact.location }}">

    <label for="linkedin">LinkedIn</label>
    <input type="text" id="linkedin" name="linkedin" value="{{ contact.linkedin }}">

    <label for="bmc_relationship">BMC Relationship</label>
    <select id="bmc_relationship" name="bmc_relationship">
        <option value="">Select relationship</option>
        {% for relationship in dropdown_values.bmc_relationships %}
            <option value="{{ relationship }}" {% if contact.bmc_relationship == relationship %}selected{% endif %}>{{ relationship }}</option>
        {% endfor %}
    </select>

    <label for="characteristics">Characteristics</label>
    <textarea id="characteristics" name="characteristics" rows="3">{{ contact.characteristics }}</textarea>

    <label for="background">Background</label>
    <textarea id="background" name="background" rows="3">{{ contact.background }}</textarea>

    <label for="personal_interests">Personal Interests</label>
    <textarea id="personal_interests" name="personal_interests" rows="3">{{ contact.personal_interests }}</textarea>

    <label for="personal_win">Personal Win</label>
    <textarea id="personal_win" name="personal_win" rows="3">{{ contact.personal_win }}</textarea>

    <label for="education">Education</label>
    <textarea id="education" name="education" rows="3">{{ contact.education }}</textarea>

    <label for="social_media">Social Media</label>
    <textarea id="social_media" name="social_media" rows="3">{{ contact.social_media }}</textarea>

    <label for="additional_notes">Additional Notes</label>
    <textarea id="additional_notes" name="additional_notes" rows="4">{{ contact.additional_notes }}</textarea>

    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('view_contact', contact_id=contact.id) }}" class="btn btn-secondary">Cancel</a>
    </div>

</form>

<script>
    const accountSelect = document.getElementById("account_id");
    const businessUnitField = document.getElementById("selected_account_business_unit");

    function updateSelectedBusinessUnit() {
        if (!accountSelect || !businessUnitField) return;
        const selectedOption = accountSelect.options[accountSelect.selectedIndex];
        businessUnitField.value = selectedOption ? selectedOption.dataset.businessUnit || "Business org not set" : "";
    }

    if (accountSelect) {
        accountSelect.addEventListener("change", updateSelectedBusinessUnit);
        updateSelectedBusinessUnit();
    }
</script>

{% endblock %}
