{% extends "base.html" %}

{% block title %}Set New Password - PipeFlow Server{% endblock %}

{% block content %}
<section class="auth-panel">
    <h2>Set New Password</h2>
    <p class="muted-text">Choose a new password for your PipeFlow Server profile.</p>

    {% if error %}
        <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form method="POST" class="form-grid">
        <label for="password">New Password</label>
        <input type="password" id="password" name="password" minlength="8" required autofocus>

        <button type="submit" class="btn btn-primary">Reset Password</button>
    </form>
</section>
{% endblock %}
