{% extends "base.html" %}

{% block title %}Add Outreach | PipeFlow{% endblock %}

{% block content %}

<div class="page-header">
    <div>
        <h1>Add Outreach</h1>
        <p>Log prospecting activity, outcomes and next actions.</p>
    </div>

    <a href="{{ url_for('outreach') }}" class="btn btn-secondary">
        Back to Outreach
    </a>
</div>

<div class="form-card">

    <form method="POST" class="pipeflow-form">

        <div class="form-grid">

            <div class="form-group">
                <label for="fy">FY</label>
                <input type="text" id="fy" name="fy" maxlength="2" pattern="[0-9]{2}" placeholder="00">
            </div>

            <div class="form-group">
                <label for="quarter">Quarter</label>
                <select id="quarter" name="quarter">
                    <option value="">Select quarter</option>
                    {% for quarter in dropdown_values.quarters %}
                        <option value="{{ quarter }}">{{ quarter }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="campaign">Campaign Name</label>
                <input type="text"
                       id="campaign"
                       name="campaign"
                       list="campaign_options"
                       placeholder="Campaign name">
                <datalist id="campaign_options">
                    {% for campaign in campaign_options %}
                        <option value="{{ campaign }}">{{ campaign }}</option>
                    {% endfor %}
                </datalist>
            </div>

            <div class="form-group">
                <label for="sales_play">Sales Play</label>
                <input type="text"
                       id="sales_play"
                       name="sales_play"
                       placeholder="Sales play or initiative">
            </div>

            <div class="form-group">
                <label for="account_id">Account</label>
                <select id="account_id" name="account_id" required>
                    <option value="">Select account</option>
                    {% for account in accounts %}
                        <option value="{{ account.id }}">{{ account.account_name }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="contact_id">Contact</label>
                <select id="contact_id" name="contact_id">
                    <option value="">Select contact</option>
                    {% for contact in contacts %}
                        <option value="{{ contact.id }}">
                            {{ contact.name }}{% if contact.account_name %} - {{ contact.account_name }}{% endif %}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="activity_type">Activity Type</label>
                <select id="activity_type" name="activity_type" required>
                    <option value="">Select activity type</option>
                    {% for activity in dropdown_values.outreach_activity_types %}
                        <option value="{{ activity }}">{{ activity }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="activity_date">Activity Start Date</label>
                <input type="date" id="activity_date" name="activity_date" required>
            </div>

            <div class="form-group">
                <label for="activity_time">Activity Start Time</label>
                <input type="time" id="activity_time" name="activity_time">
            </div>

            <div class="form-group full-width">
                <label for="subject">Subject</label>
                <input type="text" id="subject" name="subject">
            </div>

            <div class="form-group full-width">
                <label for="notes">Notes</label>
                <textarea id="notes" name="notes" rows="5"></textarea>
            </div>

            <div class="form-group">
                <label for="outcome">Outcome</label>
                <select id="outcome" name="outcome">
                    <option value="">Select outcome</option>
                    {% for outcome in dropdown_values.outreach_outcomes %}
                        <option value="{{ outcome }}">{{ outcome }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="next_action_date">Activity Due Date</label>
                <input type="date" id="next_action_date" name="next_action_date">
            </div>

            <div class="form-group">
                <label for="next_action_time">Activity Due Time</label>
                <input type="time" id="next_action_time" name="next_action_time">
            </div>

            <div class="form-group full-width">
                <label for="next_action">Next Action</label>
                <textarea id="next_action" name="next_action" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="task_status">Task Status</label>
                <select id="task_status" name="task_status">
                    {% for status in dropdown_values.task_statuses %}
                        <option value="{{ status }}" {% if status == "Not Started" %}selected{% endif %}>{{ status }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="assigned_to">Assigned To</label>
                <select id="assigned_to" name="assigned_to">
                    <option value="">Unassigned</option>

                    {% if profile and profile["full_name"] %}
                        <option value="{{ profile['full_name'] }}" selected>
                            {{ profile["full_name"] }}
                        </option>
                    {% else %}
                        <option value="Melissa" selected>Melissa</option>
                    {% endif %}
                </select>
            </div>

        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">
                Save Outreach
            </button>

            <a href="{{ url_for('outreach') }}" class="btn btn-secondary">
                Cancel
            </a>
        </div>

    </form>

</div>

{% endblock %}
