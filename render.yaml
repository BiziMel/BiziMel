services:
  - type: web
    name: pipeflow-server
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PIPEFLOW_SECRET_KEY
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: PIPEFLOW_DATA_DIR
        value: /tmp/pipeflow-server-data
      - key: PIPEFLOW_NIGHTLY_SCHEDULER
        value: "1"
      - key: PIPEFLOW_TIMEZONE
        value: Europe/London
      - key: DATABASE_URL
        sync: false
  - type: worker
    name: pipeflow-nightly-scheduler
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python scheduler_worker.py
    envVars:
      - key: PIPEFLOW_NIGHTLY_SCHEDULER
        value: "1"
      - key: PIPEFLOW_DISABLE_INPROCESS_SCHEDULER
        value: "1"
      - key: PIPEFLOW_REQUIRE_SHARED_DATABASE
        value: "1"
      - key: PIPEFLOW_TIMEZONE
        value: Europe/London
      - key: DATABASE_URL
        sync: false
